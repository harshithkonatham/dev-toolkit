# Prometheus config for local use (compose.yaml in this folder).
# In Kubernetes, use a ServiceMonitor or pod annotations instead of static targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: payments-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"] # API started with `make run`
