# promtool test rules alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: target down for 2 minutes pages
    interval: 1m
    input_series:
      - series: 'up{job="payments-api", instance="api:8000"}'
        values: "1 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: PaymentsApiDown
        exp_alerts: []
      - eval_time: 4m
        alertname: PaymentsApiDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: payments-api
              instance: api:8000
            exp_annotations:
              summary: "Payments API target api:8000 is down"
              runbook_url: "https://github.com/harshithkonatham/devops-ai-toolkit/blob/main/projects/payments-api/deploy/monitoring/RUNBOOK.md#paymentsapidown"

  - name: 10% server errors pages after 5 minutes
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="POST", route="/v1/transactions", status="201"}'
        values: "0+540x20"
      - series: 'http_requests_total{method="POST", route="/v1/transactions", status="500"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentsHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "10% of payment API requests are failing (5xx)"
              runbook_url: "https://github.com/harshithkonatham/devops-ai-toolkit/blob/main/projects/payments-api/deploy/monitoring/RUNBOOK.md#paymentshigherrorrate"

  - name: a few errors at very low traffic do not page
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/v1/transactions", status="200"}'
        values: "0+1x20"
      - series: 'http_requests_total{method="GET", route="/v1/transactions", status="500"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentsHighErrorRate
        exp_alerts: []

  - name: healthy traffic raises nothing
    interval: 1m
    input_series:
      - series: 'up{job="payments-api", instance="api:8000"}'
        values: "1x30"
      - series: 'http_requests_total{method="POST", route="/v1/transactions", status="201"}'
        values: "0+600x30"
      - series: 'transactions_created_total{currency="GBP", status="approved"}'
        values: "0+600x30"
      - series: 'transactions_created_total{currency="GBP", status="declined"}'
        values: "0+12x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentsHighErrorRate
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentsDeclineSpike
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentsApiDown
        exp_alerts: []

  - name: decline spike opens a ticket
    interval: 1m
    input_series:
      - series: 'transactions_created_total{currency="GBP", status="approved"}'
        values: "0+60x40"
      - series: 'transactions_created_total{currency="GBP", status="declined"}'
        values: "0+40x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: PaymentsDeclineSpike
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "40% of payments are being declined"
              runbook_url: "https://github.com/harshithkonatham/devops-ai-toolkit/blob/main/projects/payments-api/deploy/monitoring/RUNBOOK.md#paymentsdeclinespike"

  - name: slow payment creation opens a ticket
    interval: 1m
    input_series:
      # Every request lands between 0.5s and 1s.
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/transactions", le="0.25"}'
        values: "0x30"
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/transactions", le="0.5"}'
        values: "0x30"
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/transactions", le="1"}'
        values: "0+60x30"
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/transactions", le="+Inf"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentsSlowCreate
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "p95 latency for creating a payment is 975ms"
              runbook_url: "https://github.com/harshithkonatham/devops-ai-toolkit/blob/main/projects/payments-api/deploy/monitoring/RUNBOOK.md#paymentsslowcreate"

  - name: sustained auth failures raise a security ticket
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="POST", route="/v1/transactions", status="401"}'
        values: "0+300x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentsAuthFailures
        exp_alerts:
          - exp_labels:
              severity: ticket
              category: security
            exp_annotations:
              summary: "Sustained 401/403 responses (5.0/s): possible credential stuffing or a broken client"
              runbook_url: "https://github.com/harshithkonatham/devops-ai-toolkit/blob/main/projects/payments-api/deploy/monitoring/RUNBOOK.md#paymentsauthfailures"
