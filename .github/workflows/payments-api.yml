# DevSecOps pipeline for projects/payments-api.
#
#   test ─┐
#   sast ─┤
#   codeql┤
#   secrets┼─► image (build, CVE scan, SBOM, container e2e) ─► deploy (kind + e2e)
#   deps ─┤
#   iac ──┘
#
# Every third-party action is pinned to a full commit SHA, and each job gets
# only the permissions it needs.

name: payments-api

on:
  push:
    branches: [main]
    paths:
      - "projects/payments-api/**"
      - ".github/workflows/payments-api.yml"
  pull_request:
    paths:
      - "projects/payments-api/**"
      - ".github/workflows/payments-api.yml"
  schedule:
    - cron: "17 6 * * 1" # weekly re-scan for newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/payments-api

env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.14"
  SEMGREP_VERSION: "1.180.0"
  CHECKOV_VERSION: "3.3.29"
  TERRAFORM_VERSION: "1.9.8"
  IMAGE: payments-api:dev

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          working-directory: projects/payments-api
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Unit and integration tests (coverage gate 90%)
        run: >-
          uv run pytest --cov --cov-report=xml --cov-report=term
          --cov-fail-under=90 --junitxml=junit.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            projects/payments-api/junit.xml
            projects/payments-api/coverage.xml
          retention-days: 14

  sast:
    name: SAST (Bandit, Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          working-directory: projects/payments-api
      - name: Bandit (medium severity and above fails the build)
        run: uv run --locked bandit -r src -ll
      - name: Semgrep (Python, OWASP Top 10, secrets)
        run: >-
          uvx semgrep@${{ env.SEMGREP_VERSION }} scan
          --config p/python --config p/owasp-top-ten --config p/secrets
          --metrics off --error --sarif-output=semgrep.sarif src
      - name: Upload Semgrep results
        if: ${{ !cancelled() && hashFiles('projects/payments-api/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: projects/payments-api/semgrep.sarif
          category: semgrep

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - projects/payments-api/src
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql-python

  secrets:
    name: Secret scan (Gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          working-directory: projects/payments-api
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --quiet -o /tmp/requirements.txt
          uv run --locked pip-audit --disable-pip --strict -r /tmp/requirements.txt

  iac:
    name: IaC scan (Hadolint, Checkov, Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: projects/payments-api/Dockerfile
          failure-threshold: warning
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Checkov (Dockerfile)
        run: uvx checkov@${{ env.CHECKOV_VERSION }} --compact --framework dockerfile -f Dockerfile
      - name: Checkov (Kubernetes manifests)
        run: uvx checkov@${{ env.CHECKOV_VERSION }} --compact --framework kubernetes -d deploy/k8s
      - name: Terraform fmt and validate (no AWS credentials needed)
        working-directory: projects/payments-api/deploy/terraform
        run: |
          tf() { docker run --rm -v "$PWD:/w" -w /w "hashicorp/terraform:${TERRAFORM_VERSION}" "$@"; }
          tf fmt -check -recursive -diff
          tf init -backend=false -input=false
          tf validate
      - name: Checkov (Terraform)
        run: uvx checkov@${{ env.CHECKOV_VERSION }} --compact --framework terraform -d deploy/terraform

  image:
    name: Build, scan and test container
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: projects/payments-api
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          provenance: false
      - name: Scan image for CVEs (Grype; fail on fixable high/critical)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: grype.sarif
      - name: Upload image scan results
        if: ${{ !cancelled() && hashFiles('grype.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype.sarif
          category: grype-image
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          artifact-name: payments-api-sbom.cdx.json
          upload-release-assets: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          working-directory: projects/payments-api
      - name: Run hardened container and e2e tests
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          export JWT_SECRET
          docker run -d --name api -p 8000:8000 \
            --read-only --tmpfs /tmp --tmpfs /data:rw,uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e JWT_SECRET -e PAN_HMAC_KEY="$(openssl rand -hex 32)" \
            "$IMAGE"
          timeout 60 sh -c 'until curl -sf localhost:8000/readyz; do sleep 1; done'
          BASE_URL=http://localhost:8000 uv run --locked pytest tests/e2e -v
      - name: Container logs
        if: ${{ !cancelled() }}
        run: docker logs api || true
      - name: Save image for the deploy job
        run: docker save "$IMAGE" -o /tmp/payments-api.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payments-api-image
          path: /tmp/payments-api.tar
          retention-days: 1

  deploy:
    name: Deploy to Kubernetes (kind) and smoke test
    # Only deploy once every security gate has passed.
    needs: [image, sast, codeql, secrets, dependencies, iac]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payments-api-image
          path: /tmp
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: payments
      - name: Load image into the cluster
        run: |
          docker load -i /tmp/payments-api.tar
          kind load docker-image "$IMAGE" --name payments
      - name: Deploy
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          kubectl -n payments create secret generic payments-api-secrets \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=pan-hmac-key="$(openssl rand -hex 32)"
          kubectl apply -k deploy/k8s
          kubectl -n payments rollout status deployment/payments-api --timeout=120s
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          working-directory: projects/payments-api
      - name: E2E tests against the cluster
        run: |
          kubectl -n payments port-forward svc/payments-api 8080:80 >/tmp/port-forward.log 2>&1 &
          timeout 30 sh -c 'until curl -sf localhost:8080/readyz; do sleep 1; done'
          BASE_URL=http://localhost:8080 uv run --locked pytest tests/e2e -v
      - name: Cluster diagnostics
        if: ${{ failure() }}
        run: |
          kubectl -n payments get all,networkpolicy
          kubectl -n payments describe pods
          kubectl -n payments logs deployment/payments-api --tail=100 || true
